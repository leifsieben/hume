# Packaging for HUME's verified blocks. See PACKAGING.md for why scikit-build-core + CMake +
# pybind11 rather than ctypes, Cython, or a subprocess over text files.
#
# BUILDING IN THIS REPO -- always with the constraints file:
#
#     uv pip install -e . --python .venv/bin/python -c constraints.txt
#
# `dependencies` below is deliberately permissive, which is right for a library and wrong for
# this working tree: a bare editable install re-resolves and UPGRADES rdkit, which is the oracle
# every exactness claim is measured against. See constraints.txt.
[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "mol-hume"
version = "0.2.1"
description = "Verified molecular descriptor blocks, computed in C++"
readme = "README.md"
# BSD-3-Clause, matching rdkit and mordred, whose published parameter values and definitions
# several of these columns reproduce. See the acknowledgments in README.md.
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Leif Sieben", email = "sieben.leif@gmail.com" }]
keywords = ["cheminformatics", "molecular descriptors", "rdkit", "mordred", "qsar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# >=3.10, WHICH IS A USER FACT AND NOT A DEVELOPMENT ONE. This said >=3.11 for a reason that
# only applied inside this repo: the pinned numpy 2.4.6 in [tool.uv] below does not support
# 3.10. That pin exists to keep the rdkit/numpy oracle still for the exactness measurements; it
# has nothing to do with what a user can run, and leaking it into the metadata turned away
# anyone whose environment was 3.10.
#
# The real floor is the lowest interpreter rdkit ships across the ENTIRE supported rdkit range,
# because a mol-hume wheel without a matching rdkit is unusable:
#     rdkit 2024.09.1 (our floor)  cp39 cp310 cp311 cp312 cp313
#     rdkit 2026.03.5 (our cap)         cp310 cp311 cp312 cp313 cp314
# The intersection starts at 3.10 -- cp39 would only work against the older half of the range,
# which is a worse promise than not making it.
#
# Note mordred 1.2.0 needs 3.11 exactly (it imports `distutils`, removed in 3.12), so the
# mordred comparison env is 3.11 while the package itself is developed on 3.12. That is also a
# development fact and also not a user's problem.
requires-python = ">=3.10"
# THE RDKIT RANGE IS A HARD REQUIREMENT, NOT A PREFERENCE, and the bounds are measured.
#
# molpickle.h reads rdkit's MolPickler blob directly -- that is where most of the speed comes
# from -- and the pickle layout is explicitly not a stable API. It is pinned to format 16.2.0,
# and mol-hume refuses to import against anything else rather than silently misparsing a
# molecule into wrong descriptors with no symptom. Measured, one probe per release:
#
#     rdkit 2023.09.6   pickle 15.0.0   NO
#     rdkit 2024.03.6   pickle 16.1.0   NO
#     rdkit 2024.09.1   pickle 16.2.0   yes   <- lower bound
#     rdkit 2025.03.6   pickle 16.2.0   yes
#     rdkit 2025.09.2   pickle 16.2.0   yes   <- what the exactness numbers are measured on
#     rdkit 2026.03.5   pickle 16.3.0   yes   <- added after measuring, see below
#     rdkit 2026.09.x   pickle ?             <- upper bound, unmeasured
#
# 16.3.0 IS ACCEPTED BECAUSE IT WAS MEASURED, not because the diff looked harmless. The only
# wire-format change between 16.2.0 and 16.3.0 is AtomMonomerInfo; a SMILES-derived molecule
# never carries it, and one that does is rejected by the reader on both formats. Pickling 4,000
# corpus molecules under 2025.9.2 and 2026.3.5 with this package's exact flags: 4,000 of 4,000
# blobs differ ONLY in the version triple. Then, end to end, all 1,269 columns over 8,000
# molecules are BIT-IDENTICAL between the two releases.
#
# THE CAP IS DELIBERATELY LOOSE, and it was too tight in 0.1.0. <2026.09 was set to the exact
# measured boundary, which meant the very next rdkit release would have made mol-hume
# uninstallable for anyone whose environment already pinned it -- an aggressive answer to a risk
# that is now handled better elsewhere.
#
# What changed: the pickle-format guard is no longer an import-time ImportError. It fires when a
# pickle is actually read, it names the rdkit in use and what to do about it, and
# featurize_blocks(reader="api") keeps working on ANY rdkit because it goes through rdkit's
# supported Python API. So an unmeasured rdkit now degrades loudly and recoverably instead of
# bricking the install.
#
# The lower bound stays hard -- below 2024.09.1 the format is definitely wrong. The upper bound
# is a courtesy to resolvers: it keeps a FRESH install from picking an rdkit years newer than
# anything measured, while leaving several release lines of headroom. Run
# `tools/check_rdkit_release.py` when a new line appears and record the result; see
# MAINTENANCE.md section 1.
#
# Within the supported range the values are still version-relative: rdkit's perceived atom and
# bond properties drift, and the exactness numbers are quoted against 2025.9.2 specifically.
# That is documentation, not a pin.
dependencies = ["numpy>=1.24", "rdkit>=2024.09.1,<2028.01"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
# `tests/` only. The root holds verify_*.py, which are the slow exactness checks against RDKit
# and Mordred -- they need the 42k corpus and a second environment, and are run by hand.
testpaths = ["tests"]

[tool.uv]
# THE PIN, ENFORCED RATHER THAN DOCUMENTED. `constraints.txt` and the `-c` flag on the install
# line were not enough: they rely on every person and every agent remembering the flag, and the
# venv was silently upgraded THREE times in one session by a bare `uv pip install -e .`. The
# third time, a running verification was executing rdkit 2026.3.5 out of unlinked-but-still-
# mapped dylibs while reporting itself as the pinned version.
#
# These constraints bind uv's resolution for THIS project without touching the dependency
# metadata that ships to users, so a plain `uv pip install -e .` can no longer move the oracle.
# Keep in lockstep with constraints.txt, which is what non-uv installers read.
constraint-dependencies = ["rdkit==2025.9.2", "numpy==2.4.6"]

[tool.scikit-build]
# The package is src/molhume; src/hume_core is C++ only and is not installed. The extension
# lands next to __init__.py as molhume._core, per install(TARGETS ... DESTINATION molhume) in
# CMakeLists.txt. src/mol_hume is a three-line alias so an underscore import also works.
wheel.packages = ["src/molhume", "src/mol_hume"]
minimum-version = "0.10"

# WHAT THE SDIST HAS TO CONTAIN is not obvious from src/: hume_blocks.h and eight of its
# siblings include generated tables from cpp/ by relative path (`#include "../../cpp/..."`), so
# cpp/ is a build input, not research scaffolding, and dropping it makes the sdist unbuildable.
# Everything below IS research scaffolding -- corpora, figures, benchmark outputs, the vendored
# benchmark package -- and took the sdist to 19 MB.
# AN ALLOWLIST, AND A SHORT ONE. This repo is a research monorepo -- a 9 GB corpus, figures,
# benchmark outputs, a vendored benchmark package, 60 loose analysis scripts at the root -- and
# none of it belongs in something people download. A denylist would silently start shipping the
# next thing somebody adds; this ships what BUILDS the package and nothing else.
#
# cpp/*.h is not optional: nine headers under src/hume_core include generated tables from there
# by relative path, so it is a build input.
#
# tests/ is deliberately NOT here. The fixture alone is 1.2 MB of stored descriptor values, and
# an sdist is for building, not for shipping a dataset. The suite lives in the git repo, which
# is where anyone changing the code is working anyway.
# LISTED BY FILE TYPE, NOT BY DIRECTORY. In scikit-build-core `include` overrides `exclude`, so
# a directory glob like /src/** re-admits everything inside it -- including __pycache__, which
# is how 77 KB of compiled test bytecode and a .pyc for a file that no longer exists were
# getting shipped. Naming the extensions is what actually keeps them out.
sdist.exclude = ["*"]
sdist.include = [
  "/pyproject.toml", "/CMakeLists.txt", "/README.md", "/LICENSE", "/CHANGELOG.md",
  "/METHODS.md",
  "/src/molhume/*.py", "/src/mol_hume/*.py",
  "/src/hume_core/*.h", "/src/hume_core/*.cpp",
  "/cpp/*.h",
]
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"

# ==============================================================================================
# CROSS-PLATFORM WHEELS
# ==============================================================================================
# The matrix is pinned to what rdkit itself ships, because a mol-hume wheel for a platform with
# no rdkit wheel is a wheel that cannot be imported. rdkit 2026.3.5 publishes exactly
# macosx_11_0_arm64, manylinux_2_28 x86_64 and aarch64, and win_amd64, for cp310-cp314. So:
#
#   * NO musllinux -- rdkit has no musl wheels, so the tests could not even run there.
#   * NO i686, NO PyPy -- same reason.
#   * macOS x86_64 IS built even though rdkit dropped it after 2025.9.2, because that is the
#     release this library is verified against and an Intel Mac user pinning it should not also
#     have to compile this from source.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["*-musllinux*", "*_i686", "pp*"]
# NO build-frontend = "build[uv]". uv is not on the macOS or Windows runners, and cibuildwheel
# asserts "uv not found" before it builds anything -- a fast frontend is not worth a matrix that
# only works on Linux. The default frontend is fine; the build is CMake either way.
# Run the real suite on every wheel, on the machine that built it. The fixture comparison is
# exact, so this is also the measurement of whether gcc and MSVC agree with the clang the
# exactness numbers were taken on -- see the ffp-contract note in CMakeLists.txt.
test-requires = ["pytest", "rdkit"]
test-command = "pytest {project}/tests -q"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# rdkit's own wheels are macosx_11_0_arm64 and macosx_10_15_x86_64; match them or pip resolves
# a wheel pair that cannot be installed together.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
