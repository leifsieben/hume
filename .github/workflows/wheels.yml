# The release matrix: build every wheel, test each one on the machine that built it, publish.
#
# HOW TO CUT A RELEASE
#   1. bump `version` in pyproject.toml, write the entry in CHANGELOG.md, commit
#   2. Actions -> wheels -> Run workflow, target `testpypi`. Install from TestPyPI in a clean
#      venv and check it works.
#   3. `git tag v0.1.0 && git push --tags`. The tag publishes to PyPI.
#
# PUBLISHING USES TRUSTED PUBLISHING (OIDC), NOT AN API TOKEN. Nothing secret is stored in this
# repository or in Actions secrets: PyPI is configured to trust this repo + this workflow file
# + the named environment, and mints a short-lived token per run. Set it up at
# https://pypi.org/manage/account/publishing/ with:
#     owner leifsieben, repository hume, workflow wheels.yml, environment pypi
# and the same for test.pypi.org with environment testpypi.
name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Where to publish (none = build and test only)"
        type: choice
        options: [none, testpypi, pypi]
        default: none

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, archs: x86_64 }
          - { name: linux-aarch64, os: ubuntu-latest, archs: aarch64 }
          # Both macOS architectures from the arm64 runner. The Intel wheel is CROSS-COMPILED
          # and therefore not tested -- cibuildwheel cannot run an x86_64 wheel on an arm host,
          # and CIBW_TEST_SKIP below says so rather than letting it fail. The alternative was a
          # macos-13 runner, and GitHub is retiring those: in the first full matrix run that job
          # sat unassigned for 25 minutes while every other leg finished. Intel Mac is a
          # shrinking target anyway -- rdkit itself stopped publishing for it after 2025.9.2 --
          # but a cross-compiled wheel costs one extra build here and saves those users from
          # needing a C++ toolchain.
          - { name: macos, os: macos-latest, archs: arm64 x86_64 }
          - { name: windows-x86_64, os: windows-latest, archs: AMD64 }
    steps:
      - uses: actions/checkout@v4

      # aarch64 has no free runner on a private repo, so it is emulated. It is slow -- roughly
      # 20 minutes per interpreter against 3 native -- which is why it is a separate matrix
      # entry that can be dropped from a release without touching the other four.
      - name: Set up QEMU
        if: matrix.archs == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }

      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_TEST_SKIP: "*-macosx_x86_64"   # cross-compiled; cannot run on the arm64 host

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist

      # An sdist that does not build is worse than no sdist: pip falls back to it on any
      # platform the wheels missed, and the user gets a compiler error instead of a clean
      # "no wheel available".
      - name: Build the sdist back into a wheel and run the tests
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.tar.gz pytest
          pytest tests -q

      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }

  # cibuildwheel does NOT error when `build` names an interpreter it has never heard of: asking
  # 2.21.3 for cp314 produced cp311-cp313 and a green tick. That is the silent-gap failure this
  # whole repository is built to avoid, so the matrix is asserted rather than eyeballed.
  verify:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Every platform x interpreter present?
        shell: python
        run: |
          import pathlib, sys, itertools, collections

          PY = ["cp311", "cp312", "cp313", "cp314"]
          PLATFORMS = {
              "manylinux_2_28_x86_64": "linux x86_64",
              "manylinux_2_28_aarch64": "linux aarch64",
              "macosx_11_0_arm64": "macos arm64",
              "macosx_10_15_x86_64": "macos x86_64",
              "win_amd64": "windows x86_64",
          }
          names = [p.name for p in pathlib.Path("dist").iterdir()]
          wheels = [n for n in names if n.endswith(".whl")]
          print(f"{len(wheels)} wheels, {len([n for n in names if n.endswith('.tar.gz')])} sdist")
          for n in sorted(wheels):
              print("   ", n)

          missing = []
          for tag, label in PLATFORMS.items():
              for v in PY:
                  if not any(v in w and tag in w for w in wheels):
                      missing.append(f"{label:16s} {v}")
          if not any(n.endswith(".tar.gz") for n in names):
              missing.append("sdist")
          if missing:
              print("\nMISSING:")
              for m in missing:
                  print("   ", m)
              sys.exit("the wheel matrix is incomplete -- see above. cibuildwheel does not fail "
                       "when it silently skips an interpreter it does not support, so this check "
                       "is the only thing standing between a partial matrix and a release.")
          print("\ncomplete: every platform x interpreter, plus the sdist")

  publish:
    needs: [wheels, sdist, verify]
    if: github.event_name == 'push' || inputs.publish_to != 'none'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.publish_to }}
    permissions:
      id-token: write        # this, and only this, is what Trusted Publishing needs
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      - name: What is about to be published
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'push' || inputs.publish_to == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
